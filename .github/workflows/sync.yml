name: Upstream Sync (safe, never commit conflicts)

on:
  schedule:
    - cron: '0/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vhs-upstream-sync-main
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Merge upstream only when conflict-free
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork with full Git ancestry
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream safely; abort before any push on conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git 2>/dev/null || \
            git remote set-url upstream https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main
          git checkout main
          git reset --hard origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already synchronized with upstream/main"
            exit 0
          fi

          if ! git merge --no-ff --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Upstream merge conflicts detected. Fork main remains unchanged."
            echo "Do not push partial merges. Resolve conflicts on a dedicated branch."
            exit 1
          fi

          # Source-only checks: do not install heavy CUDA packages on the runner.
          python3 -m compileall -q videohelpersuite __init__.py
          node --check web/js/VHS.core.js
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.github/workflows').glob('*.yml'):
              source = path.read_text()
              if ('<' * 7 + ' HEAD') in source or ('>' * 7 + ' upstream/main') in source:
                  raise RuntimeError(f'Unresolved conflict marker in {path}')
          PY
          git diff HEAD^ HEAD --check
          git push origin HEAD:main
          echo "Upstream synchronized and source checks passed."
